name: Tests

# Code changes only: data commits pushed by the workflows themselves do not
# trigger other workflows.
on:
  push:
    paths: ["collectors/**", "forecasting/**", "dashboard/**", "tests/**", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collectors:
    name: Collectors and validation (stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests -v

  dashboard:
    name: Dashboard renders
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt
      - run: pip install -r dashboard/requirements.txt
      - run: python tests/smoke_dashboard.py
