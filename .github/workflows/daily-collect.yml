name: Data collection

on:
  schedule:
    - cron: "30 1 * * *"      # daily sources: 07:00 Sri Lanka time
    - cron: "30 3-23/4 * * *" # snapshots: every 4 hours (01,05,09,13,17,21:00 Sri Lanka time)
  workflow_dispatch:
    inputs:
      group:
        description: Which collectors to run
        type: choice
        options: [all, daily, snapshot]
        default: all

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Latest main, not the triggering commit: a queued run may start after
      # other runs have pushed.
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: main

      # GitHub can delay or drop scheduled runs, so every scheduled run from
      # 07:00 Sri Lanka time on also runs the daily collectors. They only add
      # missing days, so this costs nothing when the 07:00 run did happen.
      - name: Decide which collectors to run
        env:
          EVENT: ${{ github.event_name }}
          GROUP: ${{ inputs.group }}
        run: |
          hour=$(TZ=Asia/Colombo date +%-H)
          if [ "$EVENT" = "workflow_dispatch" ]; then
            daily=$([ "$GROUP" != "snapshot" ] && echo true || echo false)
            snapshot=$([ "$GROUP" != "daily" ] && echo true || echo false)
          else
            daily=$([ "$hour" -ge 7 ] && echo true || echo false)
            snapshot=true
          fi
          echo "RUN_DAILY=$daily" >> "$GITHUB_ENV"
          echo "RUN_SNAPSHOT=$snapshot" >> "$GITHUB_ENV"
          echo "Sri Lanka hour $hour: daily=$daily snapshot=$snapshot"

      # Each collector may fail independently; the others still save and commit.
      - name: Collect weather (daily)
        id: weather
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/weather.py

      - name: Collect exchange rates
        id: exchange_rates
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/exchange_rates.py

      - name: Collect river discharge
        id: river_discharge
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/river_discharge.py

      - name: Collect solar radiation
        id: solar
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/solar.py

      - name: Collect fuel prices
        id: fuel_prices
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/fuel_prices.py

      - name: Collect World Bank indicators
        id: world_bank
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/world_bank.py

      - name: Collect tourist arrivals
        id: tourism
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/tourism.py

      - name: Collect dengue cases
        id: dengue
        if: env.RUN_DAILY == 'true'
        continue-on-error: true
        run: python3 collectors/dengue.py

      - name: Collect weather snapshots
        id: weather_snapshots
        if: env.RUN_SNAPSHOT == 'true'
        continue-on-error: true
        run: python3 collectors/weather_snapshots.py

      - name: Collect air quality
        id: air_quality
        if: env.RUN_SNAPSHOT == 'true'
        continue-on-error: true
        run: python3 collectors/air_quality.py

      - name: Collect marine conditions
        id: marine
        if: env.RUN_SNAPSHOT == 'true'
        continue-on-error: true
        run: python3 collectors/marine.py

      - name: Collect CBSL rates
        id: cbsl_rates
        if: env.RUN_SNAPSHOT == 'true'
        continue-on-error: true
        run: python3 collectors/cbsl_rates.py

      - name: Collect CSE market data
        id: cse_market
        if: env.RUN_SNAPSHOT == 'true'
        continue-on-error: true
        run: python3 collectors/cse_market.py

      - name: Collect earthquakes
        id: earthquakes
        continue-on-error: true
        run: python3 collectors/earthquakes.py

      # Checks new rows; reverts any file that fails and writes STATUS.md.
      - name: Validate data
        id: validate
        continue-on-error: true
        run: python3 collectors/validate.py

      # One commit per changed data file, plus STATUS.md.
      - name: Commit and push new data
        id: commit
        env:
          COMMIT_NAME: ${{ vars.COMMIT_NAME || 'github-actions[bot]' }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL || '41898282+github-actions[bot]@users.noreply.github.com' }}
          # Stamp commits in Sri Lanka time so they land on the right day in
          # the contribution graph (the runner's default is UTC).
          TZ: Asia/Colombo
          DAILY_SOURCES: " weather exchange_rates river_discharge solar fuel_prices economy_indicators dengue tourism "
        run: |
          git config user.name "$COMMIT_NAME"
          git config user.email "$COMMIT_EMAIL"
          changed=$(git status --porcelain --untracked-files=all -- data/ STATUS.md | awk '{print $NF}')
          if [ -z "$changed" ]; then
            echo "No new data; skipping commit."
            exit 0
          fi
          day=$(TZ=Asia/Colombo date +%F)
          hour=$(TZ=Asia/Colombo date +%H:%M)
          for f in $changed; do
            name=$(basename "$f" .csv)
            case "$DAILY_SOURCES" in
              *" $name "*) stamp="$day" ;;
              *) stamp="$day $hour" ;;
            esac
            git add "$f"
            if [ "$f" = "STATUS.md" ]; then
              git commit -q -m "status: data health $day $hour"
            else
              git commit -q -m "data: ${name//_/ } update $stamp"
            fi
            echo "Committed $f"
          done
          for attempt in 1 2 3; do
            if ! git pull --rebase; then
              # A conflicting change landed first. Give up cleanly; the next run
              # re-collects (collectors only add what is missing).
              git rebase --abort || true
              echo "::error::Rebase conflict with newer commits; this run's data was not pushed"
              exit 1
            fi
            git push && exit 0
            echo "Push attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          exit 1

      # One GitHub issue per broken source (you get an email); closed again
      # automatically once the source recovers.
      - name: Open or close alert issues
        if: always()
        continue-on-error: true
        env:
          STEPS: ${{ toJSON(steps) }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 collectors/alerts.py collect

      # Runs after the commit, so saved data is never lost, but still marks
      # the run red so a broken source gets noticed.
      - name: Report collector failures
        env:
          STEPS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'EOF'
          import json, os, sys
          outcomes = [s["outcome"] for s in json.loads(os.environ["STEPS"]).values()]
          if "failure" in outcomes:
              print("::error::One or more collectors failed; see the step logs above.")
              sys.exit(1)
          print("All collectors succeeded.")
          EOF
